<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water sort and pet animation regression</title>
<style>
  :root{--wb-border:#c6d4cf;--wb-muted:#667d77;--wb-text:#25483e;--wb-panel:#f8faf6}
  body{margin:12px;background:#edf2ee;color:#25483e;font-family:Georgia,serif}
  #game{width:min(640px,100%);height:540px;margin:0 auto}
  .wb-btn{border:1px solid #c6d4cf;border-radius:8px;background:#f8faf6;color:#25483e;cursor:pointer}
  #pet{width:128px;height:128px;background-size:400% 100%;background-image:var(--wb-pet-sprite)}
  pre{white-space:pre-wrap;font-size:12px}
</style>
<div id="game"></div>
<div id="pet" class="wb-pet-fox baby eat" style="--wb-pet-sprite:url('../assets/pets/redpanda/baby/eat.png')"></div>
<pre id="result">PENDING</pre>
<script type="module">
  import { createWaterSortGame, verifyWaterSortSolution } from '../src/games/water-sort.js';
  import { playPetFrames, transferPetFrames, PET_FRAME_POSITIONS } from '../src/runtime/pet-animation.js';
  const results = [];
  const check = (condition, message) => { if (!condition) throw new Error(message); };
  const root = document.querySelector('#game');
  let game;
  try {
    let saved;
    const env = { root, document, window, save:state => { saved = structuredClone(state); },
      setScore() {}, speak() {}, clear() {}, finish() {}, toast() {}, isPaused:() => false };
    game = createWaterSortGame({ seed:88, level:120 }, env);
    check(saved.bottles.every(bottle => bottle.length > 0), 'Fixed empty bottles at start');
    check(!saved.bottles.some(bottle => bottle.length === 4 && bottle.every(color => color === bottle[0])), 'Already solved bottle at start');
    root.querySelector('[data-tool="extra"]').click();
    const board = root.querySelector('#wb-water-board');
    const bottles = [...root.querySelectorAll('[data-bottle]')];
    check(bottles.length === 21, 'Expected 21 bottles');
    check(board.scrollWidth <= board.clientWidth + 1, 'Horizontal overflow');
    for (const bottle of bottles) check(bottle.getBoundingClientRect().width >= 28, 'Bottle collapsed');
    check(board.style.getPropertyValue('--water-cols') === '7', 'Expected seven columns');
    check(board.style.getPropertyValue('--water-rows') === '3', 'Expected three rows');
    check(root.querySelector('[data-tool="extra"]').disabled, 'Extra bottle limit not enforced');
    check(root.querySelectorAll('.wb-water-fill em, .wb-water-number, [data-tool="labels"]').length === 0, 'Unwanted numbering');
    results.push('Layout PASS: ' + window.innerWidth + 'px viewport, 21 bottles, 7 columns by 3 rows');
    const path = saved.solution.slice();
    root.querySelector('[data-bottle="' + path[0].from + '"]').click();
    root.querySelector('[data-bottle="' + path[0].to + '"]').click();
    game.save();
    check(saved.moves === 1, 'Exit during animation lost move');
    const progress = JSON.stringify(saved);
    game.destroy();
    game = createWaterSortGame(saved, env);
    check(JSON.stringify(saved) === progress, 'Resume changed progress');
    check(verifyWaterSortSolution(saved.bottles, saved.solution, saved.colorCount), 'Resume lost valid path');
    results.push('Save/resume PASS: exact water layers, tools, history and helper bottle');

    const jobs = [];
    const clock = { setTimeout:fn => jobs.push(fn) };
    let pet = document.querySelector('#pet');
    pet.dataset.petAnimationKey = 'redpanda-test';
    playPetFrames(pet, clock);
    for (let index = 0; index < 4; index++) {
      check(Math.abs(parseFloat(pet.style.getPropertyValue('background-position')) - parseFloat(PET_FRAME_POSITIONS[index])) < .001, 'Incorrect sprite frame ' + index);
      if (index === 1) {
        const next = pet.cloneNode(true);
        next.classList.remove('animating');
        pet.replaceWith(next);
        check(transferPetFrames(pet, next), 'Failed to transfer story animation');
        pet = next;
      }
      jobs.shift()();
    }
    check(jobs.length === 0, 'Animation never completes');
    results.push('Pet animation PASS: four frame positions, story DOM replacement');

    const species = ['rabbit','fox','dog','cat','bird','bala','otter','hedgehog','redpanda','alpaca','sikadeer'];
    const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
    const context = canvas.getContext('2d', { willReadFrequently:true });
    let count = 0;
    for (const animal of species) for (const form of ['baby','adult','magic']) for (const action of ['normal','happy','eat','sleep','sad']) {
      const image = new Image(); image.src = '../assets/pets/' + animal + '/' + form + '/' + action + '.png';
      await image.decode();
      check(image.naturalWidth === 512 && image.naturalHeight === 128, 'Wrong strip: ' + image.src);
      context.clearRect(0, 0, 512, 128); context.drawImage(image, 0, 0);
      for (let frame = 0; frame < 4; frame++) {
        const pixels = context.getImageData(frame * 128, 0, 128, 128).data;
        let opaque = false;
        for (let i = 3; i < pixels.length; i += 4) if (pixels[i]) { opaque = true; break; }
        check(opaque, 'Empty frame: ' + image.src + ' #' + frame);
        check(pixels[3] === 0 && pixels[127 * 4 + 3] === 0, 'Opaque frame corners: ' + image.src);
      }
      count++;
    }
    results.push('Assets PASS: ' + count + ' strips, 660 nonempty frames');

    const worker = new Worker(new URL('../src/games/water-sort-worker.js', import.meta.url), { type:'module' });
    const result = await new Promise((resolve, reject) => {
      const timer = setTimeout(() => { worker.terminate(); reject(new Error('Worker timeout')); }, 10000);
      worker.onmessage = event => { clearTimeout(timer); resolve(event.data.result); };
      worker.onerror = event => { clearTimeout(timer); reject(new Error(event.message)); };
      worker.postMessage({ id:1, kind:'hint', bottles:saved.bottles });
    });
    worker.terminate();
    check(result && verifyWaterSortSolution(saved.bottles, result, saved.colorCount), 'Actual worker hint invalid');
    results.push('Worker PASS: complete verified hint path');
    document.body.dataset.result = 'PASS';
  } catch (error) {
    document.body.dataset.result = 'FAIL';
    results.push('FAIL: ' + error.stack);
  } finally {
    game?.destroy();
    document.querySelector('#result').textContent = results.join('\n');
  }
</script>
