<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宠物动图预览</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1ea;
      --panel: #fffaf3;
      --line: #d8c7aa;
      --text: #2d261f;
      --sub: #766957;
      --accent: #9f6237;
      --scene-url: url('assets/pets/scene/house-day.png');
      --pet-x: 50%;
      --pet-y: 42%;
      --pet-size: 104px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    .tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .control {
      display: grid;
      grid-template-columns: auto minmax(96px, 150px) 42px;
      align-items: center;
      gap: 6px;
      color: var(--sub);
      font-size: 12px;
    }
    .control input {
      width: 100%;
      accent-color: var(--accent);
    }
    select, button {
      min-height: 34px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    main {
      padding: 18px;
      display: grid;
      gap: 18px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .debug-line {
      color: var(--sub);
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: #fffdf9;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }
    h2 {
      margin: 0;
      font-size: 18px;
      color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }
    .card {
      min-width: 0;
      border: 1px solid var(--line);
      background: #fffdf9;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      justify-items: center;
      gap: 8px;
    }
    .single-card {
      width: min(100%, 420px);
      justify-self: center;
    }
    .meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.2;
    }
    .stage {
      position: relative;
      width: 256px;
      height: 256px;
      background: var(--scene-url) center / 100% 100% no-repeat, #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }
    .pet {
      position: absolute;
      left: var(--pet-x);
      top: var(--pet-y);
      width: var(--pet-size);
      height: var(--pet-size);
      transform: translate(-50%, -50%);
      background-repeat: no-repeat;
      background-size: 400% 100%;
      background-position: 0 0;
      animation: petFrames 2s step-end infinite;
    }
    @keyframes petFrames {
      0%, 24.999% { background-position: 0 0; }
      25%, 49.999% { background-position: 33.333% 0; }
      50%, 74.999% { background-position: 66.666% 0; }
      75%, 100% { background-position: 100% 0; }
    }
    @media (max-width: 640px) {
      header { align-items: stretch; flex-direction: column; }
      .tools { justify-content: flex-start; }
      .control { grid-template-columns: auto minmax(82px, 1fr) 38px; }
      main { padding: 10px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
      .stage { width: 172px; height: 172px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>宠物动图预览</h1>
    <div class="tools">
      <select id="species-filter" aria-label="筛选动物">
      </select>
      <select id="form-filter" aria-label="选择形态">
      </select>
      <select id="scene-filter" aria-label="切换场景">
      </select>
      <label class="control">X <input id="x-range" type="range" min="0" max="100" step="1" value="50"><output id="x-out">50%</output></label>
      <label class="control">Y <input id="y-range" type="range" min="0" max="100" step="1" value="42"><output id="y-out">42%</output></label>
      <label class="control">大小 <input id="size-range" type="range" min="32" max="160" step="1" value="104"><output id="size-out">104</output></label>
    </div>
  </header>
  <main id="app"></main>
  <script>
    const species = [
      ['fox', '狐狸'],
      ['dog', '小狗'],
      ['cat', '猫'],
      ['bala', '卡皮巴拉'],
      ['bird', '鸟'],
      ['rabbit', '兔子']
    ];
    const forms = [
      ['baby', '幼年'],
      ['adult', '成年'],
      ['magic', '魔法']
    ];
    const states = [
      ['normal', '正常'],
      ['happy', '开心'],
      ['eat', '吃饭'],
      ['sleep', '睡觉'],
      ['sad', '伤心']
    ];
    const scenes = [
      ['house-day', '小屋-日间', 'assets/pets/scene/house-day.png'],
      ['house-night', '小屋-夜间', 'assets/pets/scene/house-night.png'],
      ['forest-day', '森林-日间', 'assets/pets/scene/forest-day.png'],
      ['forest-night', '森林-夜间', 'assets/pets/scene/forest-night.png'],
      ['garden-day', '花园-日间', 'assets/pets/scene/garden-day.png'],
      ['garden-night', '花园-夜间', 'assets/pets/scene/garden-night.png']
    ];
    const app = document.getElementById('app');
    const filter = document.getElementById('species-filter');
    const formFilter = document.getElementById('form-filter');
    const sceneFilter = document.getElementById('scene-filter');
    const xRange = document.getElementById('x-range');
    const yRange = document.getElementById('y-range');
    const sizeRange = document.getElementById('size-range');
    const xOut = document.getElementById('x-out');
    const yOut = document.getElementById('y-out');
    const sizeOut = document.getElementById('size-out');

    species.forEach(([id, label]) => {
      const option = document.createElement('option');
      option.value = id;
      option.textContent = label;
      filter.appendChild(option);
    });
    forms.forEach(([id, label]) => {
      const option = document.createElement('option');
      option.value = id;
      option.textContent = label;
      formFilter.appendChild(option);
    });
    scenes.forEach(([id, label]) => {
      const option = document.createElement('option');
      option.value = id;
      option.textContent = label;
      sceneFilter.appendChild(option);
    });

    function petUrl(id, form, state) {
      return `assets/pets/${id}/${form}/${state}.png`;
    }

    function render() {
      const selected = filter.value || species[0][0];
      const selectedForm = formFilter.value || forms[0][0];
      const selectedScene = scenes.find(([id]) => id === sceneFilter.value) || scenes[0];
      const selectedLabel = species.find(([id]) => id === selected)?.[1] || selected;
      const selectedFormLabel = forms.find(([id]) => id === selectedForm)?.[1] || selectedForm;
      app.innerHTML = '';
      const section = document.createElement('section');
      section.dataset.species = selected;
      section.innerHTML = `
        <h2>${selectedLabel}</h2>
        <div class="debug-line" id="debug-line"></div>
        <div class="grid">
          <div class="card single-card">
            <div class="stage">
              <div class="pet" id="preview-pet"></div>
            </div>
            <div class="meta"><span id="preview-form">${selectedFormLabel}</span><span id="preview-state">正常</span></div>
            <div class="tools">
              <button type="button" data-state="normal">默认</button>
              <button type="button" data-state="eat">喂食</button>
              <button type="button" data-state="happy">开心</button>
              <button type="button" data-state="sleep">睡觉</button>
              <button type="button" data-state="sad">伤心</button>
            </div>
          </div>
        </div>
      `;
      app.appendChild(section);
      bindStateButtons();
      setPetState('normal');
      applyPlacement();
    }

    function selectedSpecies() {
      return filter.value || species[0][0];
    }

    function selectedForm() {
      return formFilter.value || forms[0][0];
    }

    function setPetState(state) {
      const pet = document.getElementById('preview-pet');
      if (!pet) return;
      const stateInfo = states.find(([id]) => id === state) || states[0];
      pet.dataset.state = stateInfo[0];
      pet.style.backgroundImage = `url('${petUrl(selectedSpecies(), selectedForm(), stateInfo[0])}')`;
      const stateLabel = document.getElementById('preview-state');
      if (stateLabel) stateLabel.textContent = stateInfo[1];
    }

    function bindStateButtons() {
      document.querySelectorAll('[data-state]').forEach(btn => {
        btn.addEventListener('click', () => setPetState(btn.dataset.state));
      });
    }

    function applyPlacement() {
      const selectedScene = scenes.find(([id]) => id === sceneFilter.value) || scenes[0];
      document.documentElement.style.setProperty('--scene-url', `url('${selectedScene[2]}')`);
      document.documentElement.style.setProperty('--pet-x', `${xRange.value}%`);
      document.documentElement.style.setProperty('--pet-y', `${yRange.value}%`);
      document.documentElement.style.setProperty('--pet-size', `${sizeRange.value}px`);
      xOut.textContent = `${xRange.value}%`;
      yOut.textContent = `${yRange.value}%`;
      sizeOut.textContent = sizeRange.value;
      const line = document.getElementById('debug-line');
      if (line) line.textContent = `scene: ${selectedScene[2]} | petX: ${xRange.value}% | petY: ${yRange.value}% | petSize: ${sizeRange.value}px`;
    }

    filter.addEventListener('change', render);
    formFilter.addEventListener('change', render);
    sceneFilter.addEventListener('change', () => { applyPlacement(); render(); });
    [xRange, yRange, sizeRange].forEach(input => input.addEventListener('input', applyPlacement));
    document.addEventListener('keydown', e => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      if (e.target && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return;
      const idx = Math.max(0, scenes.findIndex(([id]) => id === sceneFilter.value));
      const next = e.key === 'ArrowRight'
        ? (idx + 1) % scenes.length
        : (idx - 1 + scenes.length) % scenes.length;
      sceneFilter.value = scenes[next][0];
      applyPlacement();
      render();
    });
    applyPlacement();
    render();
  </script>
</body>
</html>
